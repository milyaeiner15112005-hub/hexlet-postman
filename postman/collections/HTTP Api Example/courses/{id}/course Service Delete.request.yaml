$kind: http-request
description: ""
url: "{{baseUrl}}/courses/:id"
method: DELETE
pathVariables:
  - key: id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: apikey
  credentials:
    key: X-API-KEY
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/course Service Delete.resources/examples
order: 3000

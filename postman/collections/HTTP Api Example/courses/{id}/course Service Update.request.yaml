$kind: http-request
description: ""
url: "{{baseUrl}}/courses/:id"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "title": "string",
      "description": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1
        },
        "description": {
          "type": "string",
          "minLength": 1
        }
      }
    }
auth:
  type: apikey
  credentials:
    key: X-API-KEY
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/course Service Update.resources/examples
order: 2000

$kind: http-example
name: The server cannot find the requested resource.
request:
  url: "{{baseUrl}}/courses/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: X-API-KEY
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "description": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000

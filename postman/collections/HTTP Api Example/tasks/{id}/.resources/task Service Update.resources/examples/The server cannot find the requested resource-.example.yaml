$kind: http-example
name: The server cannot find the requested resource.
request:
  url: "{{baseUrl}}/tasks/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "description": "string",
        "status": "Archived"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000

$kind: http-example
name: The request has succeeded.
request:
  url: "{{baseUrl}}/tasks/:id?select=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
  queryParams:
    select: string
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 7950,
        "title": "string",
        "description": "string",
        "status": "Backlog"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "description": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "string",
            "enum": [
              "Backlog",
              "Ready",
              "In Progress",
              "Done",
              "Archived"
            ]
          }
        },
        "required": [
          "id",
          "title",
          "description",
          "status"
        ]
      }
order: 1000

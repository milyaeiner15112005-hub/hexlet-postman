$kind: http-example
name: The server cannot find the requested resource.
request:
  url: "{{baseUrl}}/tasks/:id?select=string"
  method: GET
  headers:
    - key: Authorization
      value: Basic <credentials>
      description: "Added as a part of security scheme: basic"
  queryParams:
    select: string
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000

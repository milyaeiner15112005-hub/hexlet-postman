$kind: http-request
description: ""
url: "{{baseUrl}}/tasks"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "string",
      "description": "string",
      "status": "Done"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1
        },
        "description": {
          "type": "string",
          "minLength": 1
        },
        "status": {
          "allOf": [
            {
              "type": "string"
            }
          ]
        }
      },
      "required": [
        "title",
        "description"
      ]
    }
auth:
  type: basic
  credentials:
    username: "{{basicAuthUsername}}"
    password: "{{basicAuthPassword}}"
settings: {}
examples: ./.resources/task Service Create.resources/examples
order: 2000

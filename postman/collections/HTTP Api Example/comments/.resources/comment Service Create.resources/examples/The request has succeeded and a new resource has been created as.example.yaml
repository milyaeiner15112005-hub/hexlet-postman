$kind: http-example
name: The request has succeeded and a new resource has been created as a result.
request:
  url: "{{baseUrl}}/comments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "postId": 6265,
        "body": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 2844,
        "authorId": 7939,
        "postId": 8231,
        "body": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer"
          },
          "authorId": {
            "type": "integer"
          },
          "postId": {
            "type": "integer"
          },
          "body": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "id",
          "authorId",
          "postId",
          "body"
        ]
      }
order: 1000

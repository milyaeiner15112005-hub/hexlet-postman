$kind: http-example
name: The server cannot find the requested resource.
request:
  url: "{{baseUrl}}/tasks/:id"
  method: PATCH
  headers:
    Content-Type: application/json
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "description": "string",
        "status": "Done"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000

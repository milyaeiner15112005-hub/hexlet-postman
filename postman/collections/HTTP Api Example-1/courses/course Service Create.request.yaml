$kind: http-request
description: ""
url: "{{baseUrl}}/courses"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "string",
      "description": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1
        },
        "description": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "title",
        "description"
      ]
    }
auth:
  type: apikey
  credentials:
    key: X-API-KEY
    value: "{{apiKey}}"
    in: header
settings: {}
examples: ./.resources/course Service Create.resources/examples
order: 2000

$kind: http-example
name: The request has succeeded.
request:
  url: "{{baseUrl}}/posts/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "body": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "authorId": 1,
        "title": "How HTTP works",
        "body": "Taking a request and a response apart: request line, headers, body"
      }
    $type: |-
      {
        "type": "object",
        "example": {
          "id": 1,
          "authorId": 1,
          "title": "How HTTP works",
          "body": "Taking a request and a response apart: request line, headers, body"
        },
        "properties": {
          "id": {
            "type": "integer"
          },
          "authorId": {
            "type": "integer"
          },
          "title": {
            "type": "string",
            "minLength": 1
          },
          "body": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "id",
          "authorId",
          "title",
          "body"
        ]
      }
order: 1000

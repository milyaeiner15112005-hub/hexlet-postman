$kind: http-example
name: The request has succeeded and a new resource has been created as a result.
request:
  url: "{{baseUrl}}/users"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "string",
        "firstName": "string",
        "lastName": "string",
        "password": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "email": "max@hotmail.com",
        "firstName": "Allison",
        "lastName": "Bernier"
      }
    $type: |-
      {
        "type": "object",
        "example": {
          "id": 1,
          "email": "max@hotmail.com",
          "firstName": "Allison",
          "lastName": "Bernier"
        },
        "properties": {
          "id": {
            "type": "integer"
          },
          "email": {
            "type": "string",
            "minLength": 1
          },
          "firstName": {
            "type": "string",
            "minLength": 1
          },
          "lastName": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "id",
          "email",
          "firstName",
          "lastName"
        ]
      }
order: 1000

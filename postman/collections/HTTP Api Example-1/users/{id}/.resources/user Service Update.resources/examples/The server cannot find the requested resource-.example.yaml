$kind: http-example
name: The server cannot find the requested resource.
request:
  url: "{{baseUrl}}/users/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "email": "string",
        "firstName": "string",
        "lastName": "string"
      }
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: ""
order: 2000

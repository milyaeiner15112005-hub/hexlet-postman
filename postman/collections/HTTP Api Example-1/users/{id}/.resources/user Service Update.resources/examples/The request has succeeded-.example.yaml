$kind: http-example
name: The request has succeeded.
request:
  url: "{{baseUrl}}/users/:id"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: json
    content: |-
      {
        "email": "string",
        "firstName": "string",
        "lastName": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "email": "max@hotmail.com",
        "firstName": "Allison",
        "lastName": "Bernier"
      }
    $type: |-
      {
        "type": "object",
        "example": {
          "id": 1,
          "email": "max@hotmail.com",
          "firstName": "Allison",
          "lastName": "Bernier"
        },
        "properties": {
          "id": {
            "type": "integer"
          },
          "email": {
            "type": "string",
            "minLength": 1
          },
          "firstName": {
            "type": "string",
            "minLength": 1
          },
          "lastName": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "id",
          "email",
          "firstName",
          "lastName"
        ]
      }
order: 1000

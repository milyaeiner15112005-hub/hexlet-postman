$kind: http-example
name: There is no content to send for this request, but the headers may be useful.
request:
  url: "{{baseUrl}}/users/:id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000

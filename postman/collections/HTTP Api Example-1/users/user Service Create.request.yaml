$kind: http-request
description: ""
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "email": "string",
      "firstName": "string",
      "lastName": "string",
      "password": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "email": {
          "type": "string",
          "minLength": 1
        },
        "firstName": {
          "type": "string",
          "minLength": 1
        },
        "lastName": {
          "type": "string",
          "minLength": 1
        },
        "password": {
          "type": "string",
          "minLength": 1
        }
      },
      "required": [
        "email",
        "firstName",
        "lastName",
        "password"
      ]
    }
settings: {}
examples: ./.resources/user Service Create.resources/examples
order: 2000

$kind: http-example
name: The request has succeeded.
request:
  url: "{{baseUrl}}/comments/:id?select=string"
  method: GET
  headers:
    Accept: application/json
  queryParams:
    select: string
  pathVariables:
    id: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": 1,
        "authorId": 2,
        "postId": 1,
        "body": "Thanks, headers finally make sense to me"
      }
    $type: |-
      {
        "type": "object",
        "example": {
          "id": 1,
          "authorId": 2,
          "postId": 1,
          "body": "Thanks, headers finally make sense to me"
        },
        "properties": {
          "id": {
            "type": "integer"
          },
          "authorId": {
            "type": "integer"
          },
          "postId": {
            "type": "integer"
          },
          "body": {
            "type": "string",
            "minLength": 1
          }
        },
        "required": [
          "id",
          "authorId",
          "postId",
          "body"
        ]
      }
order: 1000
